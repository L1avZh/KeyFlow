name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # desktop-build needs this to create/attach to a release

jobs:
  # keyflow-core is pure Rust with no GUI dependencies, so it can be
  # built and tested on all three target OSes cheaply — this is the
  # crate where correctness matters most.
  core-test:
    name: keyflow-core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/keyflow-core"
      - run: cargo test -p keyflow-core --all-features
        working-directory: .

  clippy:
    name: Clippy (keyflow-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p keyflow-core --all-targets -- -D warnings

  frontend-typecheck:
    name: Frontend type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tsc --noEmit
        working-directory: apps/desktop

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Full desktop app build, including the native webview shell. This
  # pulls in platform GUI toolchains (WebView2 on Windows, webkitgtk on
  # Linux), so it's kept out of the fast per-PR path and only runs on
  # demand or when tagging a release. NOTE: as of this repository's
  # initial commit, this job has been written by hand following Tauri's
  # documented CI recipe but has not actually been executed — see
  # ROADMAP.md item #2. Treat its first few runs as verification, not
  # an assumed-working pipeline.
  desktop-build:
    name: Desktop build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux GTK/WebKit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "KeyFlow ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: true
