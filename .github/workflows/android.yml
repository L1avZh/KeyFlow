name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # crates/keyflow-mobile is its own standalone Cargo workspace (see the
  # comment at the top of its Cargo.toml for why), so it isn't covered by
  # the root ci.yml's `cargo test -p keyflow-core` — it needs its own job.
  # Runs on the host only (no NDK/cross-compilation needed here): its own
  # 11 tests exercise the UniFFI bridge exactly as the JVM would call it.
  mobile-core-test:
    name: keyflow-mobile tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/keyflow-mobile"
      - run: cargo test
        working-directory: crates/keyflow-mobile
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/keyflow-mobile
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: crates/keyflow-mobile

  # Full Android build: cross-compiles the Rust bridge for all 4 ABIs via
  # cargo-ndk (wired into Gradle's own preBuild — see apps/android/app/build.gradle.kts),
  # generates the UniFFI Kotlin bindings, then lints, unit-tests, and
  # builds debug + release (AAB and APK) outputs. No signing secrets are
  # required for this to pass: with none configured, the release build
  # falls back to the Android debug keystore (see the signing section of
  # apps/android/app/build.gradle.kts) — real R8/shrinking still runs, so this
  # still validates the release build genuinely works, just not that it's
  # signed for distribution.
  android-build:
    name: Android build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/keyflow-mobile"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
        working-directory: apps/android

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: apps/android

      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain
        working-directory: apps/android

      - name: Decode release keystore (only runs if the secret is configured)
        if: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > apps/android/release.keystore

      - name: Release build (AAB + APK)
        run: ./gradlew :app:bundleRelease :app:assembleRelease --console=plain
        working-directory: apps/android
        env:
          # Populated only if the repo's own secrets are configured (see
          # docs/releases/android.md) — a real signed release. Left unset
          # (e.g. on a PR from a fork, which never has access to
          # repository secrets), KEYFLOW_RELEASE_KEYSTORE points at a file
          # that doesn't exist, so app/build.gradle.kts's own check falls
          # back to debug signing — R8/shrinking still runs for real, so
          # this still validates the release build genuinely works, just
          # not that it's signed for distribution.
          KEYFLOW_RELEASE_KEYSTORE: release.keystore
          KEYFLOW_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEYFLOW_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEYFLOW_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Upload release AAB + APK
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-android-release
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
