<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1c1e27;
        color: #eef0f7;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 10px;
        font-weight: 600;
        font-size: 14px;
      }
      .header img {
        width: 20px;
        height: 20px;
      }
      .status {
        padding: 0 16px 14px;
        font-size: 12.5px;
        color: #a7abc0;
      }
      .status.ok { color: #6ee7b7; }
      .status.bad { color: #f28b82; }
      .hint {
        padding: 10px 16px 16px;
        font-size: 11.5px;
        color: #6c7086;
        border-top: 1px solid #2b2d3a;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="header"><img src="icons/icon-32.png" alt="" />KeyFlow</div>
    <div class="status" id="status">Checking connection…</div>
    <div class="hint">
      Focus a username or password field on any site to see the KeyFlow
      suggestion icon. Nothing autofills without you picking an account.
    </div>
    <script src="dist/popup.js" type="module"></script>
  </body>
</html>
