[package]
name = "keyflow-native-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Browser native-messaging host: bridges a browser extension's stdio connection to the running KeyFlow desktop app's local agent socket."

[[bin]]
name = "keyflow-native-host"
path = "src/main.rs"

[dependencies]
keyflow-agent = { path = "../keyflow-agent" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
