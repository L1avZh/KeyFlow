[workspace]
resolver = "2"
members = [
    "crates/keyflow-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KeyFlow Contributors"]
license = "MIT"
repository = "https://github.com/keyflow/keyflow"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
